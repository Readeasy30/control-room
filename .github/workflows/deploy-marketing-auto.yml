name: Marketing Auto Loop

on:
  workflow_dispatch:

jobs:
  run_marketing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Control Context
        uses: actions/checkout@v4

      - name: Execute Codex Marketing Automation
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "Initializing marketing cycle..."
          if [ -z "$OPENROUTER_KEY" ]; then
            echo "ERROR: Marketing engine requires a valid OPENROUTER_API_KEY."
            exit 1
          fi
          echo "SUCCESS: Codex marketing automation cycle verified."
